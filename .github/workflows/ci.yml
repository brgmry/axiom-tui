name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: vet
        run: go vet ./...

      - name: staticcheck
        # staticcheck 2026.2.2; keep in step with STATICCHECK_VERSION in the Makefile.
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          "$(go env GOPATH)/bin/staticcheck" ./...

      - name: test
        run: go test -race -count=1 ./...

      - name: build for windows
        run: GOOS=windows go build ./...

      - name: noaxiom build
        # The file-only build: it must vet, lint and test clean and link
        # neither the axiom-go SDK nor OpenTelemetry.
        run: |
          go build -tags noaxiom ./...
          go vet -tags noaxiom ./...
          "$(go env GOPATH)/bin/staticcheck" -tags noaxiom ./...
          go test -race -count=1 -tags noaxiom ./...
          n=$(go list -deps -tags noaxiom . | grep -c -E 'axiomhq|opentelemetry' || true)
          test "$n" -eq 0 || (echo "noaxiom build links $n axiom or opentelemetry packages" && exit 1)
