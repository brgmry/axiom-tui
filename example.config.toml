# tailboard example config
#
# Copy to ~/.config/tailboard/config.toml and keep the sources you use.
# Every key is optional: sensible defaults apply when missing.

default_source  = "pi"      # wins over default_dataset when both are set
refresh_seconds = 15        # aggregate panel refresh
stream_poll_ms  = 2000      # stream poll and file poll cadence
log_buffer_size = 2000

# pi agent sessions. The built-in "pi" source already watches
# ~/.pi/agent/sessions; override it only to change a setting.
[sources.pi]
type         = "pi"
backfill     = "48h"        # skip session files older than this
orphan_after = "120s"       # tool call with no result after this counts as orphaned
hide_levels  = ["debug"]

# Any JSONL log on disk: files, globs and directories (recursive, *.jsonl).
[sources.app]
type           = "jsonl"
paths          = ["~/logs/app/*.jsonl"]
route_prefixes = ["GET", "POST", "PUT", "DELETE", "PATCH"]

[sources.app.fields]
time        = ["timestamp", "ts"]
level       = ["level", "severity"]
message     = ["message", "msg"]
group       = "service"                 # colours lines, segments the throughput chart
cost        = "cost_usd"                # enables the Cost panel
cost_group  = "team"                    # Cost sums by this; defaults to group
duration    = ["latency_ms"]            # avg/p95/max rows in the stats panel
interesting = ["route", "user_id"]      # shown inline on each line
trace       = "request_id"              # the t key pins one value

# An Axiom dataset. Needs AXIOM_PAT (plus AXIOM_ORG_ID) or AXIOM_TOKEN in the env,
# exported or loaded with --env FILE.
[sources.prod]
type    = "axiom"
dataset = "prod-logs"

[sources.prod.fields]
interesting = ["fields.userId", "fields.route", "fields.requestId"]
group       = "fields.userId"
duration    = ["fields.latencyMs"]
